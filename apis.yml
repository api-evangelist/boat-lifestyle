apis:
- aid: boat-lifestyle-ucp-mcp
  name: boAt Lifestyle UCP Commerce MCP
  description: 'The Universal Commerce Protocol (UCP) shopping service boAt Lifestyle
    serves from its own storefront host over MCP. An anonymous JSON-RPC tools/list
    returns 13 tools covering catalog search and lookup, product detail, cart create/update/cancel,
    checkout create/update/complete/cancel, and order retrieval. Checkout completion
    requires a buyer-approval step and an idempotency-key. The implementation is Shopify''s
    native UCP support, discoverable at /.well-known/ucp.'

aid: boat-lifestyle
name: Boat Lifestyle
description: 'boAt (legal entity Imagine Marketing Limited) is an India-based consumer
  electronics brand founded in 2016 by Aman Gupta and Sameer Mehta, selling wireless
  earbuds, headphones, smartwatches, home audio and mobile accessories. Its direct-to-consumer
  storefront at boat-lifestyle.com runs on Shopify and exposes a real, anonymous agent
  commerce surface: a Universal Commerce Protocol (UCP 2026-04-08) merchant profile
  at /.well-known/ucp, a live MCP endpoint at /api/ucp/mcp serving 13 catalog, cart,
  checkout and order tools over JSON-RPC, published agent instructions at /agents.md
  and /llms.txt, and Shopify Customer Accounts OpenID Connect discovery. There is no
  first-party developer program, no OpenAPI, and no partner API portal — the machine-readable
  contract is the MCP tools/list manifest, which is platform-provided by Shopify rather
  than authored by boAt.'

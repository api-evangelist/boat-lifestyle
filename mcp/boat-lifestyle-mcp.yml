notes: >-
  Live, anonymous MCP server served from boAt Lifestyle's own storefront host. An
  unauthenticated JSON-RPC tools/list returned HTTP 200 with the full tool set and
  per-tool inputSchema (JSON Schema draft 2020-12), saved verbatim to
  boat-lifestyle-tools-list.json. This is Shopify's native Universal Commerce
